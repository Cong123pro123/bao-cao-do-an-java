# ============================================================
#  Profile MYSQL - MySQL 8
#  Tạo database trước (hoặc dùng createDatabaseIfNotExist):
#    CREATE DATABASE picklebook CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#  Biến môi trường: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:picklebook}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 30000
logging:
  level:
    com.picklebook: INFO
