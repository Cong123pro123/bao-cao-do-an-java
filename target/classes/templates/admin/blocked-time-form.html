<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout('Thiết lập lịch chặn', ~{::main})}">
<head><title>Thiết lập lịch chặn</title></head>
<body>
<main class="section">
    <div class="container" style="max-width: 800px">
        <div th:replace="~{fragments/admin-nav :: adminNav}"></div>

        <div class="mb-4">
            <span class="eyebrow">Quản trị · Giờ hoạt động &amp; Lịch</span>
            <h1 class="h2" th:text="${blockedId == null ? 'Thêm lịch chặn / bảo trì mới' : 'Cập nhật lịch chặn'}">Thiết lập lịch chặn</h1>
            <p class="text-secondary mb-0">Trong khoảng thời gian này, khách hàng sẽ không thể đặt các khung giờ tương ứng.</p>
        </div>

        <form class="panel" th:object="${blockedForm}"
              th:action="${blockedId == null ? '/admin/blocked-times' : '/admin/blocked-times/' + blockedId}" method="post">
            <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
                <p class="mb-1" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Lỗi dữ liệu.</p>
            </div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="courtId">Áp dụng cho sân</label>
                    <select class="form-select" id="courtId" th:field="*{courtId}">
                        <option value="">-- Toàn bộ hệ thống (Tất cả sân) --</option>
                        <option th:each="court : ${courts}" th:value="${court.id}" th:text="${court.name} + ' (' + ${court.branch.name} + ')'">Sân 1</option>
                    </select>
                    <div class="form-text">Để trống nếu áp dụng cho toàn bộ sân thuộc hệ thống (ví dụ: ngày nghỉ lễ tết).</div>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="blockType">Loại chặn lịch</label>
                    <select class="form-select" id="blockType" th:field="*{blockType}">
                        <option th:each="type : ${blockTypes}" th:value="${type}" th:text="${type.label}">Bảo trì</option>
                    </select>
                </div>

                <div class="col-12">
                    <label class="form-label" for="title">Tiêu đề / Lý do chặn lịch</label>
                    <input class="form-control" id="title" th:field="*{title}" maxlength="200"
                           placeholder="Ví dụ: Thay thảm mặt sân / Nghỉ lễ 30/4 / Giải vô địch Pickleball" required>
                    <div class="invalid-feedback d-block" th:errors="*{title}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="startAt">Thời gian bắt đầu</label>
                    <input class="form-control" id="startAt" type="datetime-local" th:field="*{startAt}" required>
                    <div class="invalid-feedback d-block" th:errors="*{startAt}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="endAt">Thời gian kết thúc</label>
                    <input class="form-control" id="endAt" type="datetime-local" th:field="*{endAt}" required>
                    <div class="invalid-feedback d-block" th:errors="*{endAt}"></div>
                </div>

                <div class="col-12 mt-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="affectsPricing" th:field="*{affectsPricing}">
                        <label class="form-check-label" for="affectsPricing">
                            Đánh dấu là Ngày lễ để kích hoạt Bảng giá ngày lễ (Holiday Pricing Rules) nếu có
                        </label>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4 pt-3 border-top">
                <button class="btn btn-pb" type="submit">Lưu lịch chặn</button>
                <a class="btn btn-pb-ghost" th:href="@{/admin/blocked-times}">Hủy</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
