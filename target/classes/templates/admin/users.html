<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout('Quản lý người dùng', ~{::main})}">
<head><title>Quản lý người dùng</title></head>
<body>
<main class="section">
    <div class="container">
        <div th:replace="~{fragments/admin-nav :: adminNav}"></div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div><span class="eyebrow">Quản trị</span><h1 class="h2 mb-0">Người dùng</h1></div>
            <a class="btn btn-pb" th:href="@{/admin/users/new}">Thêm người dùng</a>
        </div>
        <form class="panel row g-3 align-items-end mb-4" method="get" th:action="@{/admin/users}">
            <div class="col-md-5"><label class="form-label" for="keyword">Tên, email hoặc số điện thoại</label><input id="keyword" class="form-control" name="keyword" th:value="${keyword}"></div>
            <div class="col-md-3"><label class="form-label" for="role">Vai trò</label><select id="role" class="form-select" name="role"><option value="">Tất cả</option><option th:each="item : ${roles}" th:value="${item}" th:text="${item.label}" th:selected="${item == selectedRole}"></option></select></div>
            <div class="col-md-2"><label class="form-label" for="status">Trạng thái</label><select id="status" class="form-select" name="status"><option value="">Tất cả</option><option th:each="item : ${statuses}" th:value="${item}" th:text="${item.label}" th:selected="${item == selectedStatus}"></option></select></div>
            <div class="col-md-2 d-grid"><button class="btn btn-pb" type="submit">Tìm kiếm</button></div>
        </form>
        <section class="panel table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Người dùng</th><th>Điện thoại</th><th>Vai trò</th><th>Trạng thái</th><th>Tham gia</th><th></th></tr></thead>
                <tbody>
                <tr th:each="user : ${users.content}">
                    <td><strong class="d-block" th:text="${user.fullName}">Tên</strong><small th:text="${user.email}">email</small></td>
                    <td th:text="${user.phone ?: '—'}">—</td>
                    <td th:text="${user.roleLabel}">Khách hàng</td>
                    <td th:text="${user.statusLabel}">Đang hoạt động</td>
                    <td th:text="${user.createdAtLabel}">Ngày</td>
                    <td><a class="btn btn-sm btn-pb-ghost" th:href="@{/admin/users/{id}(id=${user.id})}">Chi tiết</a></td>
                </tr>
                <tr th:if="${users.empty}"><td colspan="6" class="text-center text-secondary py-4">Không tìm thấy người dùng.</td></tr>
                </tbody>
            </table>
            <nav th:if="${users.totalPages > 1}" class="mt-3" aria-label="Phân trang người dùng">
                <ul class="pagination mb-0">
                    <li class="page-item" th:classappend="${users.first ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/users(page=${users.number - 1},keyword=${keyword},role=${selectedRole},status=${selectedStatus})}">Trước</a></li>
                    <li class="page-item disabled"><span class="page-link" th:text="${users.number + 1} + ' / ' + ${users.totalPages}">1 / 1</span></li>
                    <li class="page-item" th:classappend="${users.last ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/users(page=${users.number + 1},keyword=${keyword},role=${selectedRole},status=${selectedStatus})}">Sau</a></li>
                </ul>
            </nav>
        </section>
    </div>
</main>
</body>
</html>
