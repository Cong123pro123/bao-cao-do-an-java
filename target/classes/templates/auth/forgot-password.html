<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/auth :: auth('Quên mật khẩu', ~{::main})}">
<head><title>Quên mật khẩu</title></head>
<body>
<main>
    <div class="auth-head">
        <span class="eyebrow">Khôi phục truy cập</span>
        <h2>Quên mật khẩu?</h2>
        <p>Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật khẩu có hiệu lực 30 phút.</p>
    </div>

    <form th:action="@{/quen-mat-khau}" th:object="${forgotPasswordForm}" method="post" class="auth-form" novalidate>
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                   placeholder="ban@example.com" autocomplete="email" required autofocus>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <button type="submit" class="btn btn-pb w-100 btn-lg-pb mt-2">Gửi liên kết</button>
    </form>

    <div class="auth-note">
        <strong>Lưu ý:</strong> vì lý do bảo mật, chúng tôi luôn hiển thị cùng một thông báo dù email có tồn tại hay không.
        Nếu không nhận được email, hãy kiểm tra thư mục Spam.
    </div>

    <p class="auth-switch"><a th:href="@{/dang-nhap}">← Quay lại đăng nhập</a></p>
</main>
</body>
</html>
