# ============================================================
#  PickleBook - cấu hình chung
#  Chạy mặc định: profile "dev" (H2 in-memory)  -> mvnw spring-boot:run
#  Chạy MySQL   : profile "mysql"               -> mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# ============================================================
spring:
  application:
    name: PickleBook
  profiles:
    default: dev
    group:
      prod: mysql
  flyway:
    baseline-on-migrate: true
    baseline-version: 2
    validate-on-migrate: true
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: dd/MM/yyyy HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 50
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 12MB
  thymeleaf:
    cache: false
    encoding: UTF-8
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    resources:
      static-locations: classpath:/static/,file:uploads/
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${SERVER_PORT:8081}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  forward-headers-strategy: framework

app:
  timezone: Asia/Ho_Chi_Minh
  upload-dir: ${UPLOAD_DIR:uploads}
  base-url: ${APP_BASE_URL:http://localhost:8081}
  booking:
    lifecycle-delay-ms: ${BOOKING_LIFECYCLE_DELAY_MS:60000}
    code-prefix: PB
    manage-token-days: 7
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:PickleBook <no-reply@picklebook.vn>}
  security:
    max-login-attempts: 5
    lock-minutes: 15

logging:
  level:
    root: INFO
    com.picklebook: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
