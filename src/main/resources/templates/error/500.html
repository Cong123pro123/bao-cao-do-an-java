<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout('Lỗi hệ thống', ~{::main})}">
<head><title>Lỗi hệ thống</title></head>
<body>
<main>
    <section class="error-page">
        <div class="container">
            <div class="error-card">
                <span class="error-code" th:text="${status != null ? status : 500}">500</span>
                <span class="eyebrow">Sự cố tạm thời</span>
                <h1>Hệ thống đang gặp sự cố</h1>
                <p th:text="${message != null ? message : 'Chúng tôi đã ghi nhận lỗi và sẽ khắc phục sớm nhất có thể.'}">
                    Chúng tôi đã ghi nhận lỗi và sẽ khắc phục sớm nhất có thể.
                </p>
                <div class="error-actions">
                    <a th:href="@{/}" class="btn btn-pb">Thử lại từ trang chủ</a>
                    <a th:href="@{/chinh-sach}" class="btn btn-pb-ghost">Xem chính sách</a>
                </div>
                <p class="error-help">
                    Cần hỗ trợ gấp? Gọi
                    <strong th:text="${site != null and site['site.phone'] != null ? site['site.phone'] : '0909 123 456'}">0909 123 456</strong>.
                </p>
            </div>
        </div>
    </section>
</main>
</body>
</html>
