<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/auth :: auth('Đặt lại mật khẩu', ~{::main})}">
<head><title>Đặt lại mật khẩu</title></head>
<body>
<main>
    <div class="auth-head">
        <span class="eyebrow">Bảo mật tài khoản</span>
        <h2>Đặt mật khẩu mới</h2>
        <p>Chọn mật khẩu mạnh từ 8 ký tự. Liên kết này chỉ sử dụng được một lần.</p>
    </div>

    <div class="alert alert-danger" role="alert" th:if="${resetError}" th:text="${resetError}">
        Liên kết không hợp lệ.
    </div>

    <form th:action="@{/dat-lai-mat-khau}" th:object="${resetPasswordForm}" method="post" class="auth-form" novalidate>
        <input type="hidden" th:field="*{token}">
        <div class="mb-3">
            <label class="form-label" for="password">Mật khẩu mới</label>
            <div class="password-field">
                <input type="password" class="form-control" id="password" th:field="*{password}"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                       placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" required autofocus>
                <button type="button" class="password-toggle" data-toggle-password="#password"
                        aria-label="Hiện hoặc ẩn mật khẩu">Hiện</button>
            </div>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label>
            <div class="password-field">
                <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                       placeholder="Nhập lại mật khẩu" autocomplete="new-password" required>
                <button type="button" class="password-toggle" data-toggle-password="#confirmPassword"
                        aria-label="Hiện hoặc ẩn mật khẩu">Hiện</button>
            </div>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>
        <button type="submit" class="btn btn-pb w-100 btn-lg-pb mt-2">Lưu mật khẩu mới</button>
    </form>

    <p class="auth-switch"><a th:href="@{/dang-nhap}">← Quay lại đăng nhập</a></p>
</main>
</body>
</html>
